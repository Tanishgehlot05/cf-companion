name: Package V2 GitHub release

on:
  push:
    tags: ['v2.*']

permissions:
  contents: write

jobs:
  package-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tagged source and history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install GNOME validation and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-shell gjs libglib2.0-bin unzip

      - name: Validate tagged source
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node --experimental-default-type=module scripts/check-release.mjs --tag "$TAG_NAME"
          for test in tests/*.test.mjs; do
            node --experimental-default-type=module "$test"
          done
          for test in tests/*.test.js; do
            gjs --module "$test"
          done
          glib-compile-schemas --strict --dry-run extension/schemas
          node --experimental-default-type=module scripts/generate-theme-stylesheet.mjs --check

      - name: Build and validate tagged package
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node --experimental-default-type=module scripts/package-extension.mjs --out-dir=dist
          zip_path="dist/cf-companion@Tanishgehlot05.github.io.shell-extension.zip"
          node --experimental-default-type=module scripts/check-release.mjs --tag "$TAG_NAME" --archive "$zip_path"

      - name: Attach package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            "dist/cf-companion@Tanishgehlot05.github.io.shell-extension.zip" \
            --title "CF Companion ${TAG_NAME#v}" \
            --generate-notes
